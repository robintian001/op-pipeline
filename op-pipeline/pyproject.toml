[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "op-pipeline"
version = "0.5.0"
description = "算子级、配置驱动的 Python 流水线框架（纯标准库）"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
keywords = ["pipeline", "etl", "workflow", "dag", "data-processing", "config-driven"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dataframe = ["pandas>=1.5"]
parquet = ["pyarrow>=12"]  # M4-2：parquet/arrow 算子的可选依赖
excel = ["openpyxl"]  # M4-3：excel 算子的可选依赖
yaml = ["pyyaml"]
otel = ["opentelemetry-api"]  # M3-6：observe.OtelHook 的可选 OTel bridge
dev = ["pytest"]

[project.scripts]
op-pipeline = "op_pipeline.cli:main"

# 插件包可在自己的 pyproject 里声明算子入口点组（M3-4），安装后由
# load_plugins(entry_points=True) / CLI 自动发现，无需 --plugin 参数：
#   [project.entry-points."op_pipeline.ops"]
#   my_ops = "my_company.ops"

[tool.setuptools.packages.find]
include = ["op_pipeline*"]

[tool.setuptools.package-data]
op_pipeline = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
