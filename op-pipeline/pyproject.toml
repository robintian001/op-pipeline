[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "op-pipeline"
version = "0.1.0"
description = "算子级、配置驱动的 Python 流水线框架（纯标准库）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml"]
dev = ["pytest"]

[project.scripts]
op-pipeline = "op_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["op_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
